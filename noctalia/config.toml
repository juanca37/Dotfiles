# Noctalia v5 (https://docs.noctalia.dev/noctalia/). Linked to ~/.config/noctalia/config.toml.
# Every *.toml in ~/.config/noctalia/ is merged. Changes made in the Settings GUI go to
# ~/.local/state/noctalia/settings.toml and override this file. If an edit here seems ignored, check there.
# All options with their defaults: https://github.com/noctalia-dev/noctalia/blob/main/example.toml

[shell]
# niri has no polkit agent of its own; without this, apps asking for admin rights never show a prompt.
polkit_agent = true

[notification]
# Show toasts above fullscreen apps too (videos, presentations). Right-click the bell for Do Not Disturb.
layer = "overlay"

[bar.default]
# Bell and tray (Slack) sit right of the clock (moved from the right-hand cluster) so they are easy to spot.
center = ["clock", "notifications", "tray"]
end    = ["media", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

[widget.notifications]
# Bell in the bar only appears when there are unread notifications,
# as a filled accent-colored pill so it stands out.
hide_when_no_unread = true
capsule             = true
capsule_fill        = "primary"
color               = "on_primary"

alias cfg="nvim ~/Dotfiles/"
alias src_zsh="source ~/.zshrc"

# ls aliases
alias ls="eza"
alias ll="ls -lah"

alias gg="lazygit"

alias cat="bat"

# Colorized kubectl output; completion still uses kubectl's
command -v kubecolor >/dev/null && { alias kubectl="kubecolor"; compdef kubecolor=kubectl; }

# omp with access to both nixcfg and Dotfiles workspaces
alias omp-dotfiles="omp --cwd ~/Projects/nixcfg --add-dir ~/Projects/Dotfiles"


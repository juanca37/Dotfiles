# Pin the shell tmux spawns for new panes to zsh, independent of any stale
# $SHELL inherited from the session. Guarded so this stays a no-op on
# machines without this NixOS path (e.g. macOS).
if-shell "test -x /run/current-system/sw/bin/zsh" "set -g default-shell /run/current-system/sw/bin/zsh"

# Leader key = ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# pane panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %


# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using vim motions
bind -r h select-pane -L
bind -r l select-pane -R
bind -r k select-pane -U
bind -r j select-pane -D

# Create new window with name prompt (Ctrl-a + Ctrl-n)
bind C-n command-prompt -p "Window name (Enter for folder name):" -I "#{b:pane_current_path}" "new-window -n '%1'"

# Use local theme file
source-file ~/.theme.conf

# Put status bar on top
set-option -g status-position top

# Enable mouse support (pane selection, resizing, scrolling)
set -g mouse on

# set-window-option -g automatic-rename off
# set-option -g allow-rename off 

# 1-keystroke window switching via tmux-fzf (bound in ~/.tmux-plugins.conf):
# Leader (Ctrl-a) + w opens tmux-fzf directly on the window list and switches immediately.
TMUX_FZF_WINDOW_FORMAT="#{window_name} (#{pane_current_command})"

# Automatic save and restore via tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'


# Plugins (tmux-fzf, tmux-resurrect, tmux-continuum) are installed by Nix, which writes this
# file with their store paths. -q makes it a no-op where it doesn't exist.
# Keep last so plugins see the options above.
source-file -q ~/.tmux-plugins.conf
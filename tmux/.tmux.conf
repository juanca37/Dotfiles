# Pin the shell tmux spawns for new panes to zsh, independent of any stale
# $SHELL inherited from the session. Guarded so this stays a no-op on
# machines without this NixOS path (e.g. macOS).
if-shell "test -x /run/current-system/sw/bin/zsh" "set -g default-shell /run/current-system/sw/bin/zsh"

# Leader key = ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# pane panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %


# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using vim motions
bind -r h select-pane -L
bind -r l select-pane -R
bind -r k select-pane -U
bind -r j select-pane -D

# Create new window with name prompt (Ctrl-a + Ctrl-n)
bind C-n command-prompt -p "Window name (Enter for folder name):" -I "#{b:pane_current_path}" "new-window -n '%1'"

# Use local theme file
source-file ~/.theme.conf

# Put status bar on top
set-option -g status-position top

